name: 📱 HDK Güvenlik APK Oluşturucu

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: ☕ Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📝 Android Lisanslarını Kabul Et
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 🏗️ Gradle Wrapper Oluştur ve İzin Ver
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew

      - name: 🚀 APK Derle (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📦 APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hdk-guvenlik-app
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
