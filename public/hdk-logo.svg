<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Dark Panel -->
    <radialGradient id="bg-grad-svg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>

    <!-- Chrome / Mirror Silver Gradient (for H and K) -->
    <linearGradient id="chrome-face-svg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#F1F5F9" />
      <stop offset="48%" stop-color="#94A3B8" />
      <stop offset="52%" stop-color="#FFFFFF" />
      <stop offset="76%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="chrome-hl-svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Ultra-Vibrant Candy 3D Red Gradient (High Luminance for D) -->
    <linearGradient id="red-face-svg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B" />
      <stop offset="16%" stop-color="#FF1E42" />
      <stop offset="46%" stop-color="#C9002B" />
      <stop offset="52%" stop-color="#FF3355" />
      <stop offset="78%" stop-color="#E6002E" />
      <stop offset="100%" stop-color="#8A001A" />
    </linearGradient>

    <linearGradient id="red-hl-svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FFAEC0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF2E50" stop-opacity="0.95" />
    </linearGradient>

    <!-- High-Luminance Red Glow Filter -->
    <filter id="red-glow-svg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FF1E42" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFAEC0" flood-opacity="0.6" />
    </filter>

    <!-- Chrome Depth Filter -->
    <filter id="chrome-depth-svg" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Dark Capsule -->
  <rect width="600" height="240" fill="url(#bg-grad-svg)" rx="24" stroke="#1E293B" stroke-width="2" />

  <!-- Subtle Floor Ambient Shadow -->
  <ellipse cx="300" cy="195" rx="260" ry="12" fill="#000000" opacity="0.85" />

  <g transform="translate(60, 45)">
    <!-- ==================== LETTER H ==================== -->
    <g filter="url(#chrome-depth-svg)">
      <path d="M 0 115 L 42 115 L 42 75 L 88 75 L 88 115 L 130 115 L 130 0 L 88 0 L 88 40 L 42 40 L 42 0 L 0 0 Z" fill="#090D16" transform="translate(0, 4)" />
      <path d="M 0 110 L 42 110 L 42 70 L 88 70 L 88 110 L 130 110 L 130 0 L 88 0 L 88 40 L 42 40 L 42 0 L 0 0 Z" fill="url(#chrome-face-svg)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="0,0 42,0 36,6 6,6" fill="url(#chrome-hl-svg)" />
      <polygon points="88,0 130,0 124,6 94,6" fill="url(#chrome-hl-svg)" />
      <polygon points="42,40 88,40 84,46 46,46" fill="url(#chrome-hl-svg)" />
      <rect x="2" y="52" width="126" height="4" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- ==================== LETTER D (CRYSTAL CLEAR RED) ==================== -->
    <g filter="url(#red-glow-svg)" transform="translate(150, 0)">
      <path d="M 0 0 L 85 0 C 130 0 152 26 152 57 C 152 88 130 114 L 0 114 Z" fill="#090D16" transform="translate(0, 4)" />
      <path d="M 0 0 L 85 0 C 130 0 152 26 152 55 C 152 84 130 110 L 0 110 Z" fill="url(#red-face-svg)" stroke="#FFB3C1" stroke-width="2" stroke-linejoin="round" />
      <path d="M 40 34 L 75 34 C 92 34 104 44 104 55 C 104 66 92 76 75 76 L 40 76 Z" fill="#060911" stroke="#FF4D6D" stroke-width="1.5" />
      <rect x="40" y="49" width="18" height="12" rx="2" fill="url(#red-face-svg)" stroke="#FFB3C1" stroke-width="1.2" />
      <path d="M 0 0 L 85 0 C 122 0 144 22 147 48 L 140 48 C 135 25 116 6 85 6 L 4 6 Z" fill="url(#red-hl-svg)" />
      <rect x="2" y="52" width="146" height="3.5" fill="#FFFFFF" opacity="0.65" />
      <circle cx="120" cy="26" r="3.5" fill="#FFFFFF" />
      <polygon points="120,18 122,26 130,26 123,29 126,36 120,31 114,36 117,29 110,26 118,26" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- ==================== LETTER K ==================== -->
    <g filter="url(#chrome-depth-svg)" transform="translate(320, 0)">
      <path d="M 0 115 L 42 115 L 42 0 L 0 0 Z M 38 65 L 100 0 L 148 0 L 75 65 L 152 115 L 102 115 L 40 70 Z" fill="#090D16" transform="translate(0, 4)" />
      <path d="M 0 110 L 42 110 L 42 0 L 0 0 Z M 38 60 L 98 0 L 146 0 L 72 63 L 150 110 L 100 110 L 40 65 Z" fill="url(#chrome-face-svg)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="0,0 42,0 36,6 6,6" fill="url(#chrome-hl-svg)" />
      <polygon points="98,0 146,0 138,6 102,6" fill="url(#chrome-hl-svg)" />
      <rect x="2" y="52" width="144" height="4" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>
</svg>
