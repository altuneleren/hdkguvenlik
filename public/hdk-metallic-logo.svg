<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Chrome / Silver Gradient (for D) -->
    <linearGradient id="chrome-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E2E8F0" />
      <stop offset="48%" stop-color="#94A3B8" />
      <stop offset="52%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="chrome-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Candy Metallic Red Gradient (for H and K) -->
    <linearGradient id="red-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="22%" stop-color="#DC2626" />
      <stop offset="48%" stop-color="#991B1B" />
      <stop offset="52%" stop-color="#EF4444" />
      <stop offset="78%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>

    <linearGradient id="red-bevel-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="red-bevel-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#2B0508" />
    </linearGradient>

    <!-- Bevel & 3D Lighting Filter -->
    <filter id="metallic-depth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF0033" flood-opacity="0.3" />
    </filter>

    <filter id="chrome-depth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="600" height="240" fill="url(#bg-glow)" rx="20" />

  <!-- Subtle Floor Reflection Line -->
  <ellipse cx="300" cy="195" rx="260" ry="12" fill="#000000" opacity="0.8" filter="blur(8px)" />

  <g transform="translate(60, 45)">
    <!-- ==================== LETTER H (METALLIC RED 3D) ==================== -->
    <g filter="url(#metallic-depth)">
      <!-- Base 3D Extrusion Layer (Dark Red Bottom & Sides) -->
      <path d="M 0 115 L 42 115 L 42 75 L 88 75 L 88 115 L 130 115 L 130 0 L 88 0 L 88 40 L 42 40 L 42 0 L 0 0 Z" 
            fill="url(#red-bevel-bottom)" transform="translate(0, 5)" />

      <!-- Main Beveled Face (H) -->
      <path d="M 0 110 L 42 110 L 42 70 L 88 70 L 88 110 L 130 110 L 130 0 L 88 0 L 88 40 L 42 40 L 42 0 L 0 0 Z" 
            fill="url(#red-face)" stroke="#FF8095" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Top Bevel Highlight (H) -->
      <polygon points="0,0 42,0 36,6 6,6" fill="url(#red-bevel-top)" />
      <polygon points="88,0 130,0 124,6 94,6" fill="url(#red-bevel-top)" />
      <polygon points="42,40 88,40 84,46 46,46" fill="url(#red-bevel-top)" />

      <!-- Center Gloss Flare (H) -->
      <rect x="2" y="52" width="126" height="4" fill="#FFFFFF" opacity="0.35" filter="blur(1px)" />
    </g>

    <!-- ==================== LETTER D (CHROME / SILVER 3D) ==================== -->
    <g filter="url(#chrome-depth)" transform="translate(150, 0)">
      <!-- Base 3D Extrusion Layer (Dark Steel Bottom) -->
      <path d="M 0 0 L 75 0 C 120 0 145 25 145 55 C 145 85 120 110 L 0 110 Z 
               M 38 35 L 70 35 C 88 35 100 45 100 55 C 100 65 88 75 70 75 L 38 75 Z"
            fill="#1E293B" transform="translate(0, 5)" />

      <!-- Main Beveled Face (D) with Distinct Tech Cutout -->
      <path d="M 0 0 L 75 0 C 120 0 145 25 145 55 C 145 85 120 110 L 0 110 Z 
               M 38 35 L 70 35 C 88 35 100 45 100 55 C 100 65 88 75 70 75 L 38 75 Z"
            fill="url(#chrome-face)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" fill-rule="evenodd" />

      <!-- Horizontal Distinct Notch/Spur inside D (from reference) -->
      <rect x="38" y="51" width="16" height="8" fill="url(#chrome-face)" stroke="#CBD5E1" stroke-width="1" />

      <!-- Top Chrome Edge Specular Highlight -->
      <path d="M 0 0 L 75 0 C 115 0 140 22 143 45 L 138 45 C 135 25 112 5 75 5 L 4 5 Z" 
            fill="url(#chrome-highlight)" />

      <!-- Center Chrome Flash Flare -->
      <rect x="2" y="52" width="140" height="3.5" fill="#FFFFFF" opacity="0.65" filter="blur(0.8px)" />
      
      <!-- Lens Glint Sparkle -->
      <circle cx="115" cy="28" r="3" fill="#FFFFFF" />
      <polygon points="115,20 117,28 125,28 118,31 121,38 115,33 109,38 112,31 105,28 113,28" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- ==================== LETTER K (METALLIC RED 3D) ==================== -->
    <g filter="url(#metallic-depth)" transform="translate(315, 0)">
      <!-- Base 3D Extrusion Layer (Dark Red Bottom) -->
      <path d="M 0 115 L 42 115 L 42 0 L 0 0 Z 
               M 38 65 L 100 0 L 148 0 L 75 65 L 152 115 L 102 115 L 40 70 Z" 
            fill="url(#red-bevel-bottom)" transform="translate(0, 5)" />

      <!-- Main Beveled Face (K) -->
      <path d="M 0 110 L 42 110 L 42 0 L 0 0 Z 
               M 38 60 L 98 0 L 146 0 L 72 63 L 150 110 L 100 110 L 40 65 Z" 
            fill="url(#red-face)" stroke="#FF8095" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Top Bevel Highlight (K) -->
      <polygon points="0,0 42,0 36,6 6,6" fill="url(#red-bevel-top)" />
      <polygon points="98,0 146,0 138,6 102,6" fill="url(#red-bevel-top)" />

      <!-- Center Gloss Flare (K) -->
      <rect x="2" y="52" width="144" height="4" fill="#FFFFFF" opacity="0.35" filter="blur(1px)" />
    </g>
  </g>
</svg>
